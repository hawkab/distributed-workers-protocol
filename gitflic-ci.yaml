stages:
  - release

workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
    - when: never

release:
  stage: release
  tags: [fleetci]
  image:
    name: '$FLEET_CI_IMAGE'
    pull_policy: never
  script:
    - python3 -m unittest discover -s ci/tests -v
    - python3 ci/fleetci.py release --provider gitflic --tag "$CI_COMMIT_TAG"
  artifacts:
    when: always
    paths: [dist/]
